<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Monitoring</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#0f0f0f;--text:#f5f5f5;--t2:#9a9a9a;--t3:#5e5e5e;--border:#242424;--acc:#f5f5f5;
--fd:'Space Grotesk',sans-serif;--fi:'Inter',sans-serif;--fm:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--fi);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--border);padding:22px 0}
.hi{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--fd);font-size:18px;font-weight:600;letter-spacing:-.03em;text-decoration:none;color:var(--text)}
.logo span{color:var(--t3)}
.seg{display:flex;border:1px solid var(--border)}
.seg button{background:none;border:none;border-right:1px solid var(--border);color:var(--t2);font-family:var(--fm);
font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 15px;cursor:pointer;transition:.15s}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
h1{font-family:var(--fd);font-size:clamp(30px,5vw,46px);font-weight:600;letter-spacing:-.03em;margin:44px 0 6px}
.sub{color:var(--t2);font-size:14.5px}
.lbl{font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:44px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--border)}
.kpi{padding:20px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.kpi b{display:block;font-family:var(--fd);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.kpi i{display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-style:normal;margin-top:8px}
.kpi u{display:block;text-decoration:none;font-size:12px;color:var(--t2);margin-top:6px}
.card{border:1px solid var(--border);padding:20px}
canvas{display:block;width:100%;height:260px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.cols{grid-template-columns:1fr}.kpi{border-right:none;border-bottom:1px solid var(--border)}.kpi:last-child{border-bottom:none}}
table{width:100%;border-collapse:collapse}
th{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);text-align:left;font-weight:400;padding:0 0 10px}
td{border-top:1px solid var(--border);padding:11px 0;font-size:14px;color:var(--t2)}
td:first-child{color:var(--text)}
td.n{font-family:var(--fm);text-align:right;white-space:nowrap}
.bar{position:relative}
.bar em{position:absolute;left:0;top:0;bottom:0;background:#1c1c1c;z-index:0}
.bar span{position:relative;z-index:1}
footer{border-top:1px solid var(--border);margin-top:56px;padding:22px 0 44px;font-family:var(--fm);font-size:11.5px;color:var(--t3)}
.warn{border:1px solid #4a3a12;background:#161207;color:#d8b45e;padding:12px 16px;font-size:13px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>

<header><div class="wrap hi">
  <a class="logo" href="/">nahreba<span> / monitoring</span></a>
  <div class="seg" id="scope">
    <button data-s="all" aria-pressed="true">All</button>
    <button data-s="whisper" aria-pressed="false">Whisper</button>
    <button data-s="poster" aria-pressed="false">Poster</button>
  </div>
</div></header>

<main class="wrap">
  <h1 id="title">All properties</h1>
  <p class="sub" id="range">Last 30 days</p>
  <div id="warn"></div>

  <p class="lbl">Overview</p>
  <div class="kpis">
    <div class="kpi"><b id="k1">—</b><i>Visitors</i><u id="d1"></u></div>
    <div class="kpi"><b id="k2">—</b><i>Page views</i><u id="d2"></u></div>
    <div class="kpi"><b id="k3">—</b><i>Avg. time on page</i><u id="d3"></u></div>
    <div class="kpi"><b id="k4">—</b><i>Bounce rate</i><u id="d4"></u></div>
  </div>

  <p class="lbl">Visitors per day</p>
  <div class="card"><canvas id="chart"></canvas></div>

  <div class="cols" style="margin-top:14px">
    <div class="card">
      <p class="lbl" style="margin:0 0 14px">Countries</p>
      <table><thead><tr><th>Country</th><th class="n">Visitors</th></tr></thead><tbody id="geo"></tbody></table>
    </div>
    <div class="card">
      <p class="lbl" style="margin:0 0 14px">Pages</p>
      <table><thead><tr><th>Path</th><th class="n">Views</th><th class="n">Avg. time</th></tr></thead><tbody id="pages"></tbody></table>
    </div>
  </div>

  <div class="cols" style="margin-top:14px">
    <div class="card">
      <p class="lbl" style="margin:0 0 14px">Referrers</p>
      <table><thead><tr><th>Source</th><th class="n">Visitors</th></tr></thead><tbody id="refs"></tbody></table>
    </div>
    <div class="card">
      <p class="lbl" style="margin:0 0 14px">Devices</p>
      <table><thead><tr><th>Type</th><th class="n">Share</th></tr></thead><tbody id="dev"></tbody></table>
    </div>
  </div>
</main>

<footer class="wrap" id="foot"></footer>

<script>
/* Data comes from ./data.json. Until that file exists the page renders a clearly
   marked sample so the layout can be judged — it never pretends to be real. */
const $=id=>document.getElementById(id);
const NAMES={all:'All properties',whisper:'Whisper',poster:'Poster'};
let DATA=null,SCOPE='all',LIVE=false;

const SAMPLE={generated:null,days:30,scopes:{
 all:{visitors:1284,views:3106,avgTime:96,bounce:47,
   series:[28,31,26,44,39,35,52,48,41,37,55,61,49,44,58,72,66,51,47,63,80,74,58,52,69,88,77,64,59,71],
   geo:[['Slovakia',214],['Ukraine',198],['Germany',151],['United States',143],['Poland',97],['Czechia',88],['United Kingdom',64]],
   pages:[['/',742,64],['/Whisper/',518,181],['/Poster/',466,204],['/whisper-case-study.html',288,146],['/poster-case-study.html',241,139],['/rutalive-case-study.html',176,122],['/cv.html',134,71]],
   refs:[['Direct',536],['Google',402],['GitHub',147],['LinkedIn',96],['Reddit',63],['Product Hunt',40]],
   dev:[['Desktop',61],['Mobile',35],['Tablet',4]]},
 whisper:{visitors:463,views:806,avgTime:181,bounce:38,
   series:[6,8,7,14,11,10,18,16,13,12,19,22,17,15,21,27,24,18,16,23,31,28,21,18,26,35,30,24,21,27],
   geo:[['United States',97],['Germany',71],['Ukraine',64],['Slovakia',52],['India',41],['United Kingdom',33],['Poland',28]],
   pages:[['/Whisper/',518,181],['/whisper-case-study.html',288,146]],
   refs:[['Google',201],['Direct',134],['GitHub',71],['Reddit',34],['Hacker News',23]],
   dev:[['Desktop',78],['Mobile',20],['Tablet',2]]},
 poster:{visitors:392,views:707,avgTime:204,bounce:41,
   series:[7,9,6,12,10,9,15,14,11,10,16,19,15,13,18,23,21,16,14,20,27,24,19,16,22,30,26,21,18,23],
   geo:[['Ukraine',88],['Slovakia',74],['Poland',59],['Germany',47],['United States',44],['Czechia',31],['France',24]],
   pages:[['/Poster/',466,204],['/poster-case-study.html',241,139]],
   refs:[['Direct',188],['Google',163],['GitHub',52],['LinkedIn',31],['Pinterest',18]],
   dev:[['Desktop',54],['Mobile',42],['Tablet',4]]}}};

const fmt=n=>n.toLocaleString('en-US');
const dur=s=>s>=60?`${Math.floor(s/60)}m ${s%60}s`:`${s}s`;

function rows(el,data,total,extra){
  el.innerHTML=data.map(r=>{
    const pct=total?Math.round(r[1]/total*100):0;
    return `<tr><td class="bar"><em style="width:${pct}%"></em><span>${r[0]}</span></td>`+
      `<td class="n">${fmt(r[1])}</td>`+(extra?`<td class="n">${dur(r[2])}</td>`:'')+`</tr>`;
  }).join('');
}

function chart(series){
  const c=$('chart'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1;
  const w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const pad={l:34,r:6,t:12,b:22},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const max=Math.max(...series,1),step=iw/(series.length-1||1);
  const y=v=>pad.t+ih-(v/max)*ih;
  // horizontal guides + scale
  ctx.font='10px "JetBrains Mono",monospace';ctx.fillStyle='#5e5e5e';ctx.textAlign='right';
  for(let i=0;i<=3;i++){const v=Math.round(max*i/3),yy=y(v);
    ctx.strokeStyle='#1a1a1a';ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();
    ctx.fillText(v,pad.l-8,yy+3);}
  // area then line — same hairline language as the rest of the site
  ctx.beginPath();series.forEach((v,i)=>{const x=pad.l+i*step;i?ctx.lineTo(x,y(v)):ctx.moveTo(x,y(v))});
  ctx.lineTo(pad.l+(series.length-1)*step,pad.t+ih);ctx.lineTo(pad.l,pad.t+ih);ctx.closePath();
  ctx.fillStyle='rgba(245,245,245,.06)';ctx.fill();
  ctx.beginPath();series.forEach((v,i)=>{const x=pad.l+i*step;i?ctx.lineTo(x,y(v)):ctx.moveTo(x,y(v))});
  ctx.strokeStyle='#f5f5f5';ctx.lineWidth=1.5;ctx.stroke();
  const last=series.length-1;
  ctx.fillStyle='#f5f5f5';ctx.beginPath();ctx.arc(pad.l+last*step,y(series[last]),3,0,7);ctx.fill();
}

function render(){
  const d=DATA.scopes[SCOPE];if(!d)return;
  $('title').textContent=NAMES[SCOPE];
  $('range').textContent=`Last ${DATA.days||30} days`;
  $('k1').textContent=fmt(d.visitors);$('k2').textContent=fmt(d.views);
  $('k3').textContent=dur(d.avgTime);$('k4').textContent=d.bounce+'%';
  $('d1').textContent=`${(d.visitors/(DATA.days||30)).toFixed(1)} / day`;
  $('d2').textContent=`${(d.views/d.visitors).toFixed(2)} per visitor`;
  $('d3').textContent='median across pages';$('d4').textContent='single-page sessions';
  chart(d.series);
  rows($('geo'),d.geo,d.geo.reduce((s,r)=>s+r[1],0));
  rows($('pages'),d.pages,d.pages.reduce((s,r)=>s+r[1],0),true);
  rows($('refs'),d.refs,d.refs.reduce((s,r)=>s+r[1],0));
  rows($('dev'),d.dev,100);
  $('foot').textContent=LIVE
    ? `Source: data.json · generated ${DATA.generated||'—'}`
    : 'Source: built-in sample — data.json not found';
}

$('scope').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  SCOPE=b.dataset.s;
  [...$('scope').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();
});
addEventListener('resize',()=>DATA&&chart(DATA.scopes[SCOPE].series));

fetch('./data.json',{cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject())
  .then(j=>{DATA=j;LIVE=true;render()})
  .catch(()=>{
    DATA=SAMPLE;
    $('warn').innerHTML='<div class="warn">Showing sample figures. Drop a <code>data.json</code> next to this file with the same shape and the page switches to it automatically.</div>';
    render();
  });
</script>
</body>
</html>
