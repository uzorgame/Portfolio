server {
    listen 80;
    server_name uz-or.com www.uz-or.com;

    root /var/www/uzor;
    index index.html;

    # Service worker без кешу
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Статичні файли з кешуванням
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # HTML без кешу
    location ~* \.html$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Всі інші файли
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
