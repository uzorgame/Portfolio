<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The mark is the product in miniature: a microphone capsule on the app's own
       orange, with the transcript it produces drawn as three rules beneath it.
       Geometry is snapped to whole units at 64 so edges stay sharp at 16. -->
  <rect width="64" height="64" rx="13" fill="#FF4F00"/>
  <rect x="27" y="13" width="10" height="20" rx="5" fill="#ffffff"/>
  <path d="M21 30a11 11 0 0 0 22 0" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="square"/>
  <rect x="30" y="41" width="4" height="6" fill="#ffffff"/>
  <!-- the transcript: full line, full line, part line -->
  <rect x="17" y="51" width="30" height="3" fill="#ffffff"/>
  <rect x="17" y="57" width="18" height="3" fill="#ffffff" opacity="0.6"/>
</svg>
