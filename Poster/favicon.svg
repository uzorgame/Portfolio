<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The mark is the product in miniature: a sheet of paper, one arterial cutting across
       it, the caption rule underneath. Geometry is snapped to whole units at 64 so the
       edges stay sharp when a browser scales it down to 16. -->
  <rect width="64" height="64" rx="13" fill="#111111"/>
  <rect x="19" y="11" width="26" height="42" fill="#ffffff"/>
  <!-- The arterial is drawn past the sheet on both sides and clipped back to it, so its
       ends read as a road running through the frame rather than stopping inside it. -->
  <clipPath id="sheet"><rect x="19" y="11" width="26" height="42"/></clipPath>
  <g clip-path="url(#sheet)">
    <path d="M14 43 L50 21" stroke="#111111" stroke-width="4.5" fill="none"/>
  </g>
  <rect x="23" y="45" width="18" height="3.5" fill="#111111"/>
</svg>
