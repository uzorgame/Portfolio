<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Full-bleed and square, because that is what the tile expects: .proj-icon
       is 52px with its own rounding, its own clip and a hairline ring, and it
       lays the artwork in with object-fit: contain. A silhouette with
       transparent corners therefore floated inside a rounded square that did not
       follow it — which is what made this one sit crooked next to the others.

       The mark itself is the app's own: the page, its folded corner, and the
       cross that says something can be added to it. Only the colours are
       exchanged, so the same glyph reads on blue as it does on white. -->
  <rect width="64" height="64" rx="13" fill="#2563EB"/>
  <g transform="translate(12 12) scale(1.25)">
    <path d="M3 4a3 3 0 0 1 3-3h13.5L29 10.5V28a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V4z" fill="#ffffff"/>
    <path d="M19.5 1 29 10.5h-6.5a3 3 0 0 1-3-3V1z" fill="#bfdbfe"/>
    <path d="M16 15.5v9M11.5 20h9" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
