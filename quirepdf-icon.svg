<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The product's own mark, sized for the card rather than for a browser tab: a
       page with its corner turned, and the caret that edits it. Geometry is snapped
       to whole units at 64 so the edges stay sharp when a browser scales it down. -->
  <rect width="64" height="64" rx="13" fill="#2563EB"/>
  <path d="M18 15a3 3 0 0 1 3-3h14l11 11v26a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V15z" fill="#ffffff"/>
  <path d="M35 12l11 11h-8a3 3 0 0 1-3-3v-8z" fill="#BFDBFE"/>
  <!-- The caret sits on the page's own baseline: a text cursor with its serifs,
       which is the one gesture that says "editable" without a word. -->
  <path d="M32 26v16M28.5 26h7M28.5 42h7" stroke="#2563EB" stroke-width="3.4"
        stroke-linecap="round" fill="none"/>
</svg>
