<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- The app's own favicon, unchanged — the same mark the product wears in a
       browser tab. Only the render size differs, because the card draws it at 52
       and a tab draws it at 16.

       Unlike the other portfolio icons this one is not a rounded square with
       artwork inside it: the glyph is a page, and a page has its own silhouette.
       Boxing it would hide the folded corner that makes it read as one. -->
