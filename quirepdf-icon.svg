  <path d="M19.5 1 29 10.5h-6.5a3 3 0 0 1-3-3V1z" fill="#1D4ED8"/>
  <path d="M16 15.5v9M11.5 20h9" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
